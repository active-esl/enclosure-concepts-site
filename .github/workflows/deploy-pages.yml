# Static gallery → GitHub Pages (ubuntu-latest Actions only).
# Do not use self-hosted runners or legacy gh-pages branch builds.
name: Deploy concept gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.resolve_url.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static publish tree
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          src, dst = Path("."), Path("_site")
          ignore = {".git", ".github", "_site", "deploy"}
          for child in src.iterdir():
              if child.name in ignore:
                  continue
              target = dst / child.name
              if child.is_dir():
                  shutil.copytree(child, target, ignore=lambda d, names: [n for n in names if n in ignore], dirs_exist_ok=True)
              else:
                  shutil.copy2(child, target)
          (dst / "CNAME").write_text("concepts.active-esl.com\n", encoding="utf-8")
          (dst / ".nojekyll").touch()
          PY
          test -f _site/index.html
          test -f _site/handheld-eth/build.json
          test -f _site/CNAME
          python3 -c 'import json; print("handheld-eth build id:", json.load(open("_site/handheld-eth/build.json"))["id"])'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          error_count: 20
          reporting_interval: 10000
          timeout: 600000

      - name: Retry deploy (OIDC / queue flake)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          error_count: 20
          reporting_interval: 10000
          timeout: 600000

      - name: Final deploy attempt
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          error_count: 30
          reporting_interval: 10000
          timeout: 900000

      - name: Expose page_url
        id: resolve_url
        if: always() && (steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success' || steps.deployment_final.outcome == 'success')
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then url="${{ steps.deployment_retry.outputs.page_url }}"; fi
          if [ -z "$url" ]; then url="${{ steps.deployment_final.outputs.page_url }}"; fi
          test -n "$url"
          echo "page_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
