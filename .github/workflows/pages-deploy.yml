# Static gallery → GitHub Pages.
# Use aesl self-hosted: ubuntu-latest jobs for this repo were stuck forever-queued
# behind uncancellable pages-build-deployment / zombie workflow_dispatch runs.
# Do not re-enable legacy gh-pages branch builds.
name: Pages deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Prefer aesl when online; fall back to any self-hosted Linux X64
    # (gitrunner) so Pages tip is not blocked when esl-proxmox-runner is offline.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static publish tree
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          src, dst = Path("."), Path("_site")
          ignore = {".git", ".github", "_site", "deploy"}
          for child in src.iterdir():
              if child.name in ignore:
                  continue
              target = dst / child.name
              if child.is_dir():
                  shutil.copytree(
                      child, target,
                      ignore=lambda d, names: [n for n in names if n in ignore],
                      dirs_exist_ok=True,
                  )
              else:
                  shutil.copy2(child, target)
          (dst / "CNAME").write_text("concepts.active-esl.com\n", encoding="utf-8")
          (dst / ".nojekyll").touch()
          PY
          test -f _site/index.html
          test -f _site/handheld-eth/build.json
          test -f _site/CNAME
          python3 -c 'import json; print("handheld-eth build id:", json.load(open("_site/handheld-eth/build.json"))["id"])'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          error_count: 20
          reporting_interval: 10000
          timeout: 600000

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          error_count: 20
          reporting_interval: 10000
          timeout: 600000

      - id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          error_count: 30
          reporting_interval: 10000
          timeout: 900000

      - name: Confirm deploy
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.deployment.outcome }}" = "success" ] || [ "${{ steps.deployment_retry.outcome }}" = "success" ] || [ "${{ steps.deployment_final.outcome }}" = "success" ]; then
            echo "Pages deploy succeeded"
          else
            echo "Pages deploy failed" >&2
            exit 1
          fi
