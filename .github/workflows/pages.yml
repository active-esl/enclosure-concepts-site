# Deploy static gallery to GitHub Pages via GitHub-hosted ubuntu-latest.
# (Self-hosted + legacy branch builds previously stuck in deployment_queued /
# Page build failed for this org — do not regress to those paths.)
#
# Pages Settings (required once):
#   Settings → Pages → Build and deployment → Source = GitHub Actions
#   (API: build_type=workflow).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static publish tree
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # Publish repo root as the site; keep Actions metadata / VCS out of the artifact.
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          src = Path(".")
          dst = Path("_site")
          ignore = {".git", ".github", "_site"}

          for child in src.iterdir():
              if child.name in ignore:
                  continue
              target = dst / child.name
              if child.is_dir():
                  shutil.copytree(
                      child,
                      target,
                      ignore=lambda d, names: [n for n in names if n in ignore],
                      dirs_exist_ok=True,
                  )
              else:
                  shutil.copy2(child, target)
          PY
          touch _site/.nojekyll
          echo "publish_bytes=$(du -sb _site | awk '{print $1}')"
          test -f _site/index.html
          test -f _site/handheld-eth/build.json
          python3 -c 'import json; print("handheld-eth build id:", json.load(open("_site/handheld-eth/build.json"))["id"])'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
