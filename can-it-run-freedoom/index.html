  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

    const canvas=document.getElementById('c'), status=document.getElementById('status'), hint=document.getElementById('hint'), gameCanvas=document.getElementById('screen');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,2,.001,20);
    camera.position.set(.35,.31,.29);
    const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.target.set(.122,0,-.083); controls.minDistance=.26; controls.maxDistance=1.2;
    const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),.04).texture;
    scene.add(new THREE.HemisphereLight(0xddeeff,0x182030,1.7));
    const key=new THREE.DirectionalLight(0xffffff,3.1); key.position.set(-.4,.7,.55); scene.add(key);
    const fill=new THREE.DirectionalLight(0x7fcfff,1.7); fill.position.set(.7,.25,-.5); scene.add(fill);

    let lcd=null,liveTexture=null,lastCopy=0,refreshUntil=0,pointerStart=null,activeGameKey=null;
    const bridge=document.createElement('canvas'); bridge.width=960; bridge.height=600;
    const bridgeCtx=bridge.getContext('2d',{alpha:false});
    liveTexture=new THREE.CanvasTexture(bridge); liveTexture.colorSpace=THREE.SRGBColorSpace; liveTexture.flipY=false; liveTexture.minFilter=THREE.LinearFilter; liveTexture.magFilter=THREE.LinearFilter;

    function paintUxStatus(title,detail,progress=null,error=false){
      const w=bridge.width,h=bridge.height,barX=120,barY=390,barW=w-240,barH=18;
      bridgeCtx.fillStyle='#07111f';bridgeCtx.fillRect(0,0,w,h);
      bridgeCtx.fillStyle=error?'#ff6075':'#3ec6ff';bridgeCtx.fillRect(0,0,w,8);
      bridgeCtx.fillStyle='#f4f7fb';bridgeCtx.font='700 25px Segoe UI, sans-serif';bridgeCtx.fillText('ACTIVE-EDGE',48,64);
      bridgeCtx.fillStyle='#a9b4c7';bridgeCtx.font='16px Segoe UI, sans-serif';bridgeCtx.fillText('ACTIVE BOOKING SCREEN · LIVE PRODUCT TWIN',48,94);
      bridgeCtx.textAlign='center';bridgeCtx.fillStyle='#f4f7fb';bridgeCtx.font='700 48px Segoe UI, sans-serif';bridgeCtx.fillText(title,w/2,265);
      bridgeCtx.fillStyle='#a9b4c7';bridgeCtx.font='22px Segoe UI, sans-serif';bridgeCtx.fillText(detail,w/2,315);
      if(progress!==null){
        const value=Math.max(0,Math.min(100,progress));
        bridgeCtx.fillStyle='#1b2a3d';bridgeCtx.fillRect(barX,barY,barW,barH);
        bridgeCtx.fillStyle=error?'#ff6075':'#a8e04f';bridgeCtx.fillRect(barX,barY,barW*value/100,barH);
        bridgeCtx.fillStyle='#f4f7fb';bridgeCtx.font='700 22px Segoe UI, sans-serif';bridgeCtx.fillText(`${Math.round(value)}%`,w/2,455);
      }
      bridgeCtx.textAlign='left';liveTexture.needsUpdate=true;
    }
    paintUxStatus('Loading engine…','Downloading the open Freedoom runtime',0);

    new GLTFLoader().load('../handheld-eth/handheld.glb',gltf=>{
      const model=gltf.scene;
      model.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;if(o.name==='LCD'||o.parent?.name==='LCD'){
        lcd=o; o.material=new THREE.MeshStandardMaterial({color:0xffffff,map:liveTexture,emissive:0xffffff,emissiveMap:liveTexture,emissiveIntensity:1.35,roughness:.36,metalness:.02,envMapIntensity:.08});
      }});
      scene.add(model);
    },undefined,e=>{status.textContent='Model failed to load';console.error(e)});

    const uxStartedAt=performance.now();
    function showUxFailure(error){
      const message=String(error?.message||error||'runtime failed');console.error('Freedoom failed to start',error);status.textContent='Engine failed to start · reload';status.dataset.error='true';window.__ACTIVE_POE_LIVE_ERROR__=message;paintUxStatus('Engine failed to start',message.slice(0,84),0,true);
    }
    function findEngineCanvas(){
      if(gameCanvas.width>0&&gameCanvas.height>0&&window.freedoomRuntimeReady===true&&typeof window.freedoomInput==='function'){status.textContent='Live engine · touch controls ready';status.dataset.ready='true';window.__ACTIVE_POE_LIVE_READY__=true;window.freedoomInput(13,true);setTimeout(()=>window.freedoomInput(13,false),80);return}
      const now=performance.now();
      if(window.freedoomRuntimeError||now-uxStartedAt>90000){showUxFailure(window.freedoomRuntimeError||'runtime-timeout');return}
      setTimeout(findEngineCanvas,250);
    }
    findEngineCanvas();

    const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
    function hitDisplay(ev){
      if(!lcd)return null;const r=canvas.getBoundingClientRect();pointer.x=((ev.clientX-r.left)/r.width)*2-1;pointer.y=-((ev.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);
      return raycaster.intersectObject(lcd,true)[0]||null;
    }
    function gameKeyAt(uv){
      const x=uv.x*960,y=uv.y*600;
      if(x<735)return 13;
      if(y>=150&&y<=220&&x>=774&&x<=844)return 0xad;
      if(y>=230&&y<=300&&x>=744&&x<=814)return 0xac;
      if(y>=230&&y<=300&&x>=824&&x<=894)return 0xae;
      if(y>=310&&y<=380&&x>=774&&x<=844)return 0xaf;
      if(y>=405&&y<=467&&x>=748&&x<=834)return 0x9d;
      if(y>=405&&y<=467&&x>=844&&x<=930)return 32;
      return 13;
    }
    canvas.addEventListener('pointerdown',ev=>{const hit=hitDisplay(ev);pointerStart=hit?{x:ev.clientX,y:ev.clientY,uv:hit.uv.clone(),pointerType:ev.pointerType}:null;if(pointerStart&&window.__ACTIVE_POE_LIVE_READY__){controls.enabled=false;activeGameKey=gameKeyAt(hit.uv);window.freedoomInput(activeGameKey,true);refreshUntil=performance.now()+1000;canvas.setPointerCapture(ev.pointerId);ev.preventDefault()}});
    canvas.addEventListener('pointermove',ev=>{canvas.style.cursor=hitDisplay(ev)?'pointer':'grab'});
    canvas.addEventListener('pointerup',ev=>{
      if(!pointerStart)return;const moved=Math.hypot(ev.clientX-pointerStart.x,ev.clientY-pointerStart.y),hit=hitDisplay(ev),start=pointerStart;pointerStart=null;
      if(activeGameKey!==null&&typeof window.freedoomInput==='function')window.freedoomInput(activeGameKey,false);
      activeGameKey=null;controls.enabled=true;
      const tapSlop=start.pointerType==='touch'?18:8;
      if(moved<=tapSlop&&hit?.uv){hint.textContent='Input sent to the live engine';status.textContent='Live engine · input acknowledged';window.__ACTIVE_POE_LAST_TOUCH__={phase:'tap',u:hit.uv.x,v:hit.uv.y}}
    });
    canvas.addEventListener('pointercancel',()=>{if(activeGameKey!==null&&typeof window.freedoomInput==='function')window.freedoomInput(activeGameKey,false);activeGameKey=null;pointerStart=null;controls.enabled=true});

    function resize(){const r=document.getElementById('stage').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
    function drawRuntime(){
      bridgeCtx.fillStyle='#07111f';bridgeCtx.fillRect(0,0,960,600);
      bridgeCtx.drawImage(gameCanvas,22,72,696,435);
      bridgeCtx.fillStyle='#20d6d2';bridgeCtx.fillRect(22,32,4,22);
      bridgeCtx.fillStyle='#f7f9fc';bridgeCtx.font='700 20px Segoe UI';bridgeCtx.fillText('FREEDOOM / POE EDGE RUNTIME',38,51);
      bridgeCtx.fillStyle='#0f2035';bridgeCtx.fillRect(738,72,202,435);
      bridgeCtx.fillStyle='#20d6d2';bridgeCtx.font='700 15px Segoe UI';bridgeCtx.fillText('TOUCH CONTROL',758,108);
      const button=(x,y,w,h,label,accent=false)=>{bridgeCtx.fillStyle=accent?'#263950':'#142b47';bridgeCtx.strokeStyle=accent?'#b6f23b':'#20d6d2';bridgeCtx.lineWidth=2;bridgeCtx.fillRect(x,y,w,h);bridgeCtx.strokeRect(x,y,w,h);bridgeCtx.fillStyle=accent?'#b6f23b':'#f7f9fc';bridgeCtx.font='700 17px Segoe UI';bridgeCtx.textAlign='center';bridgeCtx.textBaseline='middle';bridgeCtx.fillText(label,x+w/2,y+h/2)};
      button(774,150,70,70,'▲');button(744,230,70,70,'◀');button(824,230,70,70,'▶');button(774,310,70,70,'▼');button(748,405,86,62,'FIRE',true);button(844,405,86,62,'OPEN');
      bridgeCtx.textAlign='left';bridgeCtx.textBaseline='alphabetic';bridgeCtx.fillStyle='#91a3ba';bridgeCtx.font='13px Segoe UI';bridgeCtx.fillText('DRAG OUTSIDE DISPLAY TO ORBIT',22,552);bridgeCtx.fillText('OPEN ENGINE + OPEN GAME DATA',660,552);
    }
    function animate(t){requestAnimationFrame(animate);controls.update();const copyInterval=t<refreshUntil?30:100;if(window.__ACTIVE_POE_LIVE_READY__&&t-lastCopy>copyInterval){try{drawRuntime();liveTexture.needsUpdate=true;lastCopy=t}catch(e){console.warn('UX texture copy failed',e)}}renderer.render(scene,camera)}animate(0);
    window.__ACTIVE_POE_LIVE__={hitDisplay,bridge,get lcd(){return lcd},get gameCanvas(){return gameCanvas}};
  </script>
