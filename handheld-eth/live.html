<!doctype html>
<html lang="en" style="background:#0b1220;color-scheme:dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Active POE — Live UX</title>
  <link rel="stylesheet" href="../site-nav.css">
  <style>
    :root{--bg:#0b1220;--panel:rgba(12,18,32,.88);--text:#f4f7fb;--muted:#a9b4c7;--accent:#3ec6ff;--ok:#a8e04f}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(1200px 700px at 70% 10%,#15233d 0%,var(--bg) 55%);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
    #stage{position:fixed;inset:var(--site-nav-h,46px) 0 0}#c{display:block;width:100%;height:100%;touch-action:none}
    .bar{position:fixed;z-index:15;left:12px;right:12px;top:calc(10px + var(--site-nav-h,46px));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
    .meta,.status{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
    .meta h1{margin:0;font-size:.95rem;font-weight:650}.meta p,.status{margin:2px 0 0;color:var(--muted);font-size:.8rem}.status[data-ready="true"]{color:var(--ok)}
    .hint{position:fixed;z-index:15;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 15px;color:var(--muted);font-size:.8rem;pointer-events:none;white-space:nowrap}
    #godotHost{position:fixed;left:-1400px;top:0;width:1280px;height:800px;border:0;opacity:.001;pointer-events:none;background:#071019}
    @media(max-width:640px){.bar{top:calc(8px + var(--site-nav-h,84px));flex-direction:column}.hint{font-size:.72rem;max-width:calc(100% - 16px);white-space:normal;text-align:center}}
  </style>
</head>
<body>
  <nav id="siteNav" class="site-nav" data-root="../" data-concept="eth" data-mode="live" aria-label="Concept site"></nav>
  <script src="../site-nav.js" defer></script>
  <main id="stage"><canvas id="c" aria-label="Interactive Active POE product twin"></canvas></main>
  <div class="bar"><div class="meta"><h1>Active POE — Live UX</h1><p>Drag to orbit · tap the display to use the running Godot interface</p></div><div id="status" class="status">Starting UX…</div></div>
  <div id="hint" class="hint">Tap the display to use it · drag outside it to orbit · pinch or scroll to zoom</div>
  <iframe id="godotHost" title="Active POE Godot UX runtime" src="ux/index.html" width="1280" height="800"></iframe>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

    const canvas=document.getElementById('c'), status=document.getElementById('status'), hint=document.getElementById('hint'), frame=document.getElementById('godotHost');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,2,.001,20);
    camera.position.set(.35,.31,.29);
    const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.target.set(.122,0,-.083); controls.minDistance=.26; controls.maxDistance=1.2;
    const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),.04).texture;
    scene.add(new THREE.HemisphereLight(0xddeeff,0x182030,1.7));
    const key=new THREE.DirectionalLight(0xffffff,3.1); key.position.set(-.4,.7,.55); scene.add(key);
    const fill=new THREE.DirectionalLight(0x7fcfff,1.7); fill.position.set(.7,.25,-.5); scene.add(fill);

    let lcd=null,godotCanvas=null,liveTexture=null,lastCopy=0,refreshUntil=0,pointerStart=null;
    const bridge=document.createElement('canvas'); bridge.width=960; bridge.height=600;
    const bridgeCtx=bridge.getContext('2d',{alpha:false}); bridgeCtx.fillStyle='#071019'; bridgeCtx.fillRect(0,0,bridge.width,bridge.height);
    liveTexture=new THREE.CanvasTexture(bridge); liveTexture.colorSpace=THREE.SRGBColorSpace; liveTexture.flipY=false; liveTexture.minFilter=THREE.LinearFilter; liveTexture.magFilter=THREE.LinearFilter;

    new GLTFLoader().load('handheld.glb',gltf=>{
      const model=gltf.scene;
      model.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;if(o.name==='LCD'||o.parent?.name==='LCD'){
        lcd=o; o.material=new THREE.MeshStandardMaterial({color:0xffffff,map:liveTexture,emissive:0xffffff,emissiveMap:liveTexture,emissiveIntensity:1.35,roughness:.36,metalness:.02,envMapIntensity:.08});
      }});
      scene.add(model); if(!window.__ACTIVE_POE_LIVE_READY__) status.textContent='Model ready · starting UX…';
    },undefined,e=>{status.textContent='Model failed to load';console.error(e)});

    function findGodotCanvas(){
      try{const candidate=frame.contentDocument?.getElementById('canvas'),api=frame.contentWindow?.activePoeInput;if(candidate&&candidate.width>0&&candidate.height>0&&typeof api==='function'){godotCanvas=candidate;status.textContent='Live UX · tap screen, drag model';status.dataset.ready='true';window.__ACTIVE_POE_LIVE_READY__=true;return}}
      catch(e){console.warn(e)} setTimeout(findGodotCanvas,250);
    }
    frame.addEventListener('load',()=>setTimeout(findGodotCanvas,250));
    findGodotCanvas();

    const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
    function hitDisplay(ev){
      if(!lcd)return null;const r=canvas.getBoundingClientRect();pointer.x=((ev.clientX-r.left)/r.width)*2-1;pointer.y=-((ev.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);
      return raycaster.intersectObject(lcd,true)[0]||null;
    }
    canvas.addEventListener('pointerdown',ev=>{const hit=hitDisplay(ev);pointerStart=hit?{x:ev.clientX,y:ev.clientY,uv:hit.uv.clone()}:null});
    canvas.addEventListener('pointermove',ev=>{canvas.style.cursor=hitDisplay(ev)?'pointer':'grab'});
    canvas.addEventListener('pointerup',ev=>{
      if(!pointerStart)return;const moved=Math.hypot(ev.clientX-pointerStart.x,ev.clientY-pointerStart.y),hit=hitDisplay(ev),start=pointerStart;pointerStart=null;
      if(moved>8||!hit?.uv)return;
      const u=(start.uv.x+hit.uv.x)/2,v=1-(start.uv.y+hit.uv.y)/2;
      frame.contentWindow.activePoeInput(u,v);refreshUntil=performance.now()+1000;hint.textContent='Tap delivered to the running Godot UX';window.__ACTIVE_POE_LAST_TOUCH__={phase:'tap',u,v};
    });
    canvas.addEventListener('pointercancel',()=>{pointerStart=null});

    function resize(){const r=document.getElementById('stage').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
    function animate(t){requestAnimationFrame(animate);controls.update();const copyInterval=t<refreshUntil?100:1000;if(godotCanvas&&t-lastCopy>copyInterval){try{bridgeCtx.drawImage(godotCanvas,0,0,bridge.width,bridge.height);liveTexture.needsUpdate=true;lastCopy=t}catch(e){console.warn('UX texture copy failed',e);godotCanvas=null;findGodotCanvas()}}renderer.render(scene,camera)}animate(0);
    window.__ACTIVE_POE_LIVE__={hitDisplay,bridge,frame,get lcd(){return lcd},get godotCanvas(){return godotCanvas}};
  </script>
  <script src="../pages-update.js" defer></script>
</body>
</html>
