  <div class="bar"><div class="meta"><h1>MAX Pad Tactical Tablet — Live UX</h1><p>Drag to orbit · tap the display to operate the running Godot tactical interface</p></div><div id="status" class="status">Starting UX…</div></div>

  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

    const canvas=document.getElementById('c'), status=document.getElementById('status'), hint=document.getElementById('hint'), godotCanvas=document.getElementById('godotCanvas');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,2,.001,20);
    camera.position.set(.35,.31,.29);
    const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.target.set(.122,0,-.083); controls.minDistance=.26; controls.maxDistance=1.2;
    const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),.04).texture;
    scene.add(new THREE.HemisphereLight(0xddeeff,0x182030,1.7));
    const key=new THREE.DirectionalLight(0xffffff,3.1); key.position.set(-.4,.7,.55); scene.add(key);
    const fill=new THREE.DirectionalLight(0x7fcfff,1.7); fill.position.set(.7,.25,-.5); scene.add(fill);

    let lcd=null,liveTexture=null,lastCopy=0,refreshUntil=0,pointerStart=null;
    const bridge=document.createElement('canvas'); bridge.width=960; bridge.height=600;
    const bridgeCtx=bridge.getContext('2d',{alpha:false});
    liveTexture=new THREE.CanvasTexture(bridge); liveTexture.colorSpace=THREE.SRGBColorSpace; liveTexture.flipY=false; liveTexture.minFilter=THREE.LinearFilter; liveTexture.magFilter=THREE.LinearFilter;

    function paintUxStatus(title,detail,progress=null,error=false){
      const w=bridge.width,h=bridge.height,barX=120,barY=390,barW=w-240,barH=18;
      bridgeCtx.fillStyle='#07111f';bridgeCtx.fillRect(0,0,w,h);
      bridgeCtx.fillStyle=error?'#ff6075':'#3ec6ff';bridgeCtx.fillRect(0,0,w,8);
      bridgeCtx.fillStyle='#f4f7fb';bridgeCtx.font='700 25px Segoe UI, sans-serif';bridgeCtx.fillText('ACTIVE-EDGE',48,64);
      bridgeCtx.fillStyle='#a9b4c7';bridgeCtx.font='16px Segoe UI, sans-serif';bridgeCtx.fillText('MAX PAD TACTICAL TABLET · LIVE PRODUCT TWIN',48,94);
      bridgeCtx.textAlign='center';bridgeCtx.fillStyle='#f4f7fb';bridgeCtx.font='700 48px Segoe UI, sans-serif';bridgeCtx.fillText(title,w/2,265);
      bridgeCtx.fillStyle='#a9b4c7';bridgeCtx.font='22px Segoe UI, sans-serif';bridgeCtx.fillText(detail,w/2,315);
      if(progress!==null){
        const value=Math.max(0,Math.min(100,progress));
        bridgeCtx.fillStyle='#1b2a3d';bridgeCtx.fillRect(barX,barY,barW,barH);
        bridgeCtx.fillStyle=error?'#ff6075':'#a8e04f';bridgeCtx.fillRect(barX,barY,barW*value/100,barH);
        bridgeCtx.fillStyle='#f4f7fb';bridgeCtx.font='700 22px Segoe UI, sans-serif';bridgeCtx.fillText(`${Math.round(value)}%`,w/2,455);
      }
      bridgeCtx.textAlign='left';liveTexture.needsUpdate=true;
    }
    paintUxStatus('Loading interface…','Downloading the live Godot UX',0);

    new GLTFLoader().load('../handheld-eth/handheld.glb',gltf=>{
      const model=gltf.scene;
      model.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;if(o.name==='LCD'||o.parent?.name==='LCD'){
        lcd=o; o.material=new THREE.MeshStandardMaterial({color:0xffffff,map:liveTexture,emissive:0xffffff,emissiveMap:liveTexture,emissiveIntensity:1.35,roughness:.36,metalness:.02,envMapIntensity:.08});
      }});
      scene.add(model);
    },undefined,e=>{status.textContent='Model failed to load';console.error(e)});

    const uxStartedAt=performance.now();
    let godotLaunchedAt=0,runtimeReady=false;
    const godotEngine=new Engine({
      canvas:godotCanvas,
      canvasResizePolicy:0,
      executable:'tactical',
      fileSizes:{'https://active-esl.github.io/godot-demos/resilient-tactical-picture/tactical-59c2c9c23c5b.pck':1518448,'https://active-esl.github.io/godot-demos/resilient-tactical-picture/tactical-59c2c9c23c5b.wasm':19796835},
      focusCanvas:false,
      args:[],
      experimentalVK:false,
      gdnativeLibs:[],
      onProgress:(current,total)=>{if(total>0&&!runtimeReady){const percent=Math.round(current/total*100);if(percent>=100){status.textContent='Preparing UX…';paintUxStatus('Preparing interface…','Download complete · starting the engine',100)}else{status.textContent=`Loading UX · ${percent}%`;paintUxStatus('Loading interface…','Downloading the live Godot UX',percent)}}}
    });
    // Fetch the shared runtime from the POE asset directory, but mount the
    // pack under a clean virtual-FS name. Godot cannot mount a "../" pack path.
    Promise.all([
      godotEngine.init('https://active-esl.github.io/godot-demos/resilient-tactical-picture/tactical-59c2c9c23c5b'),
      godotEngine.preloadFile('https://active-esl.github.io/godot-demos/resilient-tactical-picture/tactical-59c2c9c23c5b.pck','tactical.pck')
    ]).then(()=>godotEngine.start({args:['--main-pack','tactical.pck']})).then(()=>{godotLaunchedAt=performance.now();status.textContent='Launching UX…';paintUxStatus('Launching interface…','Godot is preparing the first frame',100);setTimeout(markUxReady,3000)}).catch(showUxFailure);
    function showUxFailure(error){
      const message=String(error?.message||error||'runtime failed');console.error('Godot failed to start',error);status.textContent='UX failed to start · reload';status.dataset.error='true';window.__ACTIVE_POE_LIVE_ERROR__=message;paintUxStatus('Interface failed to start',message.slice(0,84),0,true);
    }
    function markUxReady(){runtimeReady=true;status.textContent='Live UX · tap screen, drag model';status.dataset.ready='true';window.__ACTIVE_POE_LIVE_READY__=true}

    let deliveredInputs=0,lastDeliveredAt=0;
    function deliverGodotTap(u,v){
      const r=godotCanvas.getBoundingClientRect(),clientX=r.left+u*r.width,clientY=r.top+v*r.height;
      godotCanvas.focus();
      for(const type of ['mousedown','mouseup','click']) godotCanvas.dispatchEvent(new MouseEvent(type,{bubbles:true,cancelable:true,view:window,clientX,clientY,button:0,buttons:type==='mousedown'?1:0}));
      deliveredInputs+=1;window.__ACTIVE_POE_LAST_ACK__={ack:deliveredInputs,u,v};return deliveredInputs;
    }

    const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
    function hitDisplay(ev){
      if(!lcd)return null;const r=canvas.getBoundingClientRect();pointer.x=((ev.clientX-r.left)/r.width)*2-1;pointer.y=-((ev.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);
      return raycaster.intersectObject(lcd,true)[0]||null;
    }
    canvas.addEventListener('pointerdown',ev=>{const hit=hitDisplay(ev);pointerStart=hit?{x:ev.clientX,y:ev.clientY,uv:hit.uv.clone(),pointerType:ev.pointerType}:null});
    canvas.addEventListener('pointermove',ev=>{canvas.style.cursor=hitDisplay(ev)?'pointer':'grab'});
    canvas.addEventListener('pointerup',ev=>{
      if(!pointerStart)return;const moved=Math.hypot(ev.clientX-pointerStart.x,ev.clientY-pointerStart.y),hit=hitDisplay(ev),start=pointerStart;pointerStart=null;
      const tapSlop=start.pointerType==='touch'?18:8;
      if(moved>tapSlop||!hit?.uv)return;
      if(!window.__ACTIVE_POE_LIVE_READY__){hint.textContent='The interface is still loading';return}
      // CanvasTexture.flipY is disabled, so the LCD's UV Y axis already has
      // the same top-to-bottom orientation as Godot's viewport coordinates.
      const u=(start.uv.x+hit.uv.x)/2,v=(start.uv.y+hit.uv.y)/2;
      const ack=deliverGodotTap(u,v);refreshUntil=performance.now()+1000;window.__ACTIVE_POE_LAST_TOUCH__={phase:'tap',u,v};
      lastDeliveredAt=performance.now();
      hint.textContent=`Tap delivered to Godot #${ack}`;status.textContent=`Live UX · input delivered #${ack}`;
    });
    canvas.addEventListener('click',ev=>{
      if(performance.now()-lastDeliveredAt<250||!window.__ACTIVE_POE_LIVE_READY__)return;
      const hit=hitDisplay(ev);if(!hit?.uv)return;
      const ack=deliverGodotTap(hit.uv.x,hit.uv.y);lastDeliveredAt=performance.now();refreshUntil=lastDeliveredAt+1000;
      hint.textContent=`Tap delivered to Godot #${ack}`;status.textContent=`Live UX · input delivered #${ack}`;
    });
    canvas.addEventListener('pointercancel',()=>{pointerStart=null});

    function resize(){const r=document.getElementById('stage').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
    function animate(t){requestAnimationFrame(animate);controls.update();const copyInterval=t<refreshUntil?100:1000;if(window.__ACTIVE_POE_LIVE_READY__&&t-lastCopy>copyInterval){try{bridgeCtx.drawImage(godotCanvas,0,0,bridge.width,bridge.height);liveTexture.needsUpdate=true;lastCopy=t}catch(e){console.warn('UX texture copy failed',e)}}renderer.render(scene,camera)}animate(0);
    window.__ACTIVE_POE_LIVE__={hitDisplay,deliverGodotTap,bridge,godotEngine,get lcd(){return lcd},get godotCanvas(){return godotCanvas}};
  </script>
